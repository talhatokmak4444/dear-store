<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEAR STORE | Telefon Aksesuarları & Bileklik</title>
  <style>
    :root {
      --ana: #111827;
      --turuncu: #f27a1a;
      --turuncu-koyu: #d9650b;
      --yesil: #15803d;
      --arka: #f5f5f7;
      --kart: #ffffff;
      --yazi: #1f2937;
      --gri: #6b7280;
      --sinir: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--arka);
      color: var(--yazi);
    }

    .ust-bant {
      background: var(--ana);
      color: #fff;
      text-align: center;
      font-size: 12px;
      padding: 7px 12px;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--sinir);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-ic {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ana);
      font-weight: 800;
      font-size: 18px;
    }

    .logo img {
      height: 34px;
      width: auto;
      border-radius: 6px;
    }

    .sag-butonlar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .ikincil-btn {
      background: #f3f4f6;
      color: var(--ana);
      border: 1px solid var(--sinir);
      padding: 8px 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .sepet-btn {
      background: var(--turuncu);
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .kategoriler {
      background: #fff;
      border-bottom: 1px solid var(--sinir);
      overflow-x: auto;
      white-space: nowrap;
    }

    .kategoriler-ic {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
    }

    .kat-btn {
      border: 1px solid var(--sinir);
      background: #fff;
      color: var(--yazi);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .kat-btn.aktif {
      background: var(--turuncu);
      color: #fff;
      border-color: var(--turuncu);
    }

    .banner {
      max-width: 1100px;
      margin: 16px auto 0;
      padding: 0 16px;
    }

    .banner-kutu {
      background: linear-gradient(120deg, #111827, #1f2937);
      color: #fff;
      border-radius: 14px;
      padding: 22px 20px;
    }

    .banner-kutu h1 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .banner-kutu p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .konteyner {
      max-width: 1100px;
      margin: 18px auto 40px;
      padding: 0 16px;
    }

    .izgara {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
    }

    .kart {
      background: var(--kart);
      border: 1px solid var(--sinir);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .kart:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .kart-gorsel {
      height: 150px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px;
      transition: background 0.2s ease;
    }

    .rozet {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #111827;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 5px;
    }

    .kart-icerik {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .kart-baslik {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 4px;
      color: var(--ana);
    }

    .kart-alt {
      font-size: 12px;
      color: var(--gri);
      margin: 0 0 10px;
    }
