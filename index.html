<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEAR STORE | Telefon Aksesuarları & Bileklik</title>
  <style>
    :root {
      --ana: #111827;
      --turuncu: #f27a1a;
      --turuncu-koyu: #d9650b;
      --arka: #f5f5f7;
      --kart: #ffffff;
      --yazi: #1f2937;
      --gri: #6b7280;
      --sinir: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--arka);
      color: var(--yazi);
    }

    .ust-bant {
      background: var(--ana);
      color: #fff;
      text-align: center;
      font-size: 12px;
      padding: 7px 12px;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--sinir);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-ic {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ana);
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.3px;
    }

    .logo img {
      height: 34px;
      width: auto;
      border-radius: 6px;
    }

    .sepet-btn {
      background: var(--turuncu);
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kategoriler {
      background: #fff;
      border-bottom: 1px solid var(--sinir);
      overflow-x: auto;
      white-space: nowrap;
    }

    .kategoriler-ic {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
    }

    .kat-btn {
      border: 1px solid var(--sinir);
      background: #fff;
      color: var(--yazi);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .kat-btn.aktif {
      background: var(--turuncu);
      color: #fff;
      border-color: var(--turuncu);
    }

    .banner {
      max-width: 1100px;
      margin: 16px auto 0;
      padding: 0 16px;
    }

    .banner-kutu {
      background: linear-gradient(120deg, #111827, #1f2937);
      color: #fff;
      border-radius: 14px;
      padding: 24px 20px;
    }

    .banner-kutu h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .banner-kutu p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .konteyner {
      max-width: 1100px;
      margin: 18px auto 40px;
      padding: 0 16px;
    }

    .izgara {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
    }

    .kart {
      background: var(--kart);
      border: 1px solid var(--sinir);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .kart:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .kart-gorsel {
      height: 150px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px;
    }

    .kart-gorsel img {
      max-width: 100%;
      max-height: 125px;
      object-fit: contain;
    }

    .rozet {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #111827;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 5px;
    }

    .kart-icerik {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .kart-baslik {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 4px;
      color: var(--ana);
    }

    .kart-alt {
      font-size: 12px;
      color: var(--gri);
      margin: 0 0 10px;
    }

    .kart-fiyat {
      margin-top: auto;
      font-size: 16px;
      font-weight: 800;
      color: var(--turuncu);
    }

    .incele-yazi {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ana);
      background: #f3f4f6;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
    }

    /* Ürün Detay ve Sepet Penceresi */
    .modal-arka {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-arka.acik {
      display: flex;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-ust {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .kapat-btn {
      background: #f3f4f6;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .detay-gorsel {
      background: #f9fafb;
      border: 1px solid var(--sinir);
      border-radius: 10px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .detay-fiyat {
      font-size: 22px;
      font-weight: 800;
      color: var(--turuncu);
      margin: 8px 0;
    }

    .secenekler {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0 16px;
    }

    .secenek {
      border: 1px solid var(--sinir);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      background: #fff;
    }

    .secenek.secili {
      border-color: var(--turuncu);
      background: #fff7ed;
      color: var(--turuncu-koyu);
      font-weight: 700;
    }

    .ana-btn {
      width: 100%;
      background: var(--turuncu);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .sepet-satir {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--sinir);
      font-size: 14px;
    }

    footer {
      background: var(--ana);
      color: #9ca3af;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="ust-bant">DEAR STORE • Hızlı Kargo & Güvenli Alışveriş</div>

  <header>
    <div class="header-ic">
      <a class="logo" href="#">
        <img src="./dear-store-logo.png" alt="DEAR STORE" onerror="this.style.display='none'">
        <span>DEAR STORE</span>
      </a>
      <button class="sepet-btn" onclick="sepetAc()">
        Sepetim (<span id="sepet-sayi">0</span>)
      </button>
    </div>
    <div class="kategoriler">
      <div class="kategoriler-ic">
        <button class="kat-btn aktif" onclick="filtrele('hepsi', this)">Tümü</button>
        <button class="kat-btn" onclick="filtrele('kilif', this)">Telefon Kılıfları</button>
        <button class="kat-btn" onclick="filtrele('bileklik', this)">Bileklikler</button>
        <button class="kat-btn" onclick="filtrele('aksesuar', this)">Aksesuar & Şarj</button>
      </div>
    </div>
  </header>

  <section class="banner">
    <div class="banner-kutu">
      <h1>Telefonunu ve Tarzını Tamamla</h1>
      <p>Ürünün üzerine tıklayarak detayları inceleyebilir ve sepete ekleyebilirsin.</p>
    </div>
  </section>

  <main class="konteyner">
    <div class="izgara" id="urun-listesi"></div>
  </main>

  <!-- Ürün Detay Penceresi -->
  <div class="modal-arka" id="detay-modal" onclick="disTikla(event, 'detay-modal')">
    <div class="modal">
      <div class="modal-ust">
        <strong id="m-kategori">Ürün Detayı</strong>
        <button class="kapat-btn" onclick="modalKapat('detay-modal')">×</button>
      </div>
      <div class="detay-gorsel" id="m-gorsel"></div>
      <h2 id="m-baslik" style="margin:0; font-size:19px;"></h2>
      <div class="detay-fiyat" id="m-fiyat"></div>
      <p id="m-aciklama" style="color:#4b5563; font-size:14px; line-height:1.5;"></p>
      <div style="font-size:13px; font-weight:700;">Seçenek:</div>
      <div class="secenekler" id="m-secenekler"></div>
      <button class="ana-btn" onclick="sepeteEkle()">Sepete Ekle</button>
    </div>
  </div>

  <!-- Sepet Penceresi -->
  <div class="modal-arka" id="sepet-modal" onclick="disTikla(event, 'sepet-modal')">
    <div class="modal">
      <div class="modal-ust">
        <strong>Sepetim</strong>
        <button class="kapat-btn" onclick="modalKapat('sepet-modal')">×</button>
      </div>
      <div id="sepet-icerik"></div>
      <div style="margin:14px 0; font-size:16px; font-weight:800; display:flex; justify-content:space-between;">
        <span>Toplam:</span>
        <span id="sepet-toplam">0 TL</span>
      </div>
      <button class="ana-btn" onclick="siparisTamamla()">Siparişi Onayla</button>
    </div>
  </div>

  <footer>
    © 2026 DEAR STORE • Tüm hakları saklıdır.
  </footer>

    const urunler = [
      {
        id: 1,
        kategori: "kilif",

        fiyat: 199,
        aciklama: "Kamera korumalı, kadife iç yüzeyli ve elde kaymayan özel dokulu telefon kılıfı. Tüm popüler modellerle uyumludur.",
